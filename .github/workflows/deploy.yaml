name: Build and Deploy
on:
  push:
    branches:
      - main
permissions:
  id-token: write     ####This allows GitHub Actions to request an OIDC token.
  contents: read      ####Allows the workflow to read your repository.
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: lucidity-task
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::555292118434:role/GitHubActions-EKS-Deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./Python_App
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
      - name: Get EKS cluster name
        id: get-cluster
        run: |
          echo "cluster_name=$(aws eks list-clusters --region $AWS_REGION --query 'clusters[0]' --output text)" >> "$GITHUB_OUTPUT"
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name ${{ steps.get-cluster.outputs.cluster_name }}
      - name: Deploy application
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install lucidity-task ./helm/lucidity-task \
            --namespace application \
            --create-namespace \
            --set image.repository=$ECR_REGISTRY/$ECR_REPOSITORY \
            --set image.tag=$IMAGE_TAG
