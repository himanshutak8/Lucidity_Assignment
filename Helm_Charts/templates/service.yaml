apiVersion: v1
kind: Service
metadata:
  name: app-service
  labels:
    app: flask-app
    stage: assignment
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app: flask-app